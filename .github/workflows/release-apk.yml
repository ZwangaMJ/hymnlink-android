name: Release APK

# Builds the app and publishes the APK on GitHub Releases.
#
#   * Push a tag such as v1.2.0            -> signed release APK, attached to a GitHub Release for that tag
#   * Actions tab -> Run workflow          -> pick "release" (signed) or "debug"; the APK is always saved as a
#                                             workflow artifact. A Release is only created when the run is started
#                                             on a tag (choose the tag in "Use workflow from").
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   GOOGLE_SERVICES_JSON  Base64 of app/google-services.json
#   KEYSTORE_BASE64       Base64 of your release keystore (.jks)        } needed for "release" builds.
#   KEYSTORE_PASSWORD     Keystore password                             } A release build FAILS without them
#   KEY_ALIAS             Key alias inside the keystore                 } instead of publishing an unsigned,
#   KEY_PASSWORD          Key password                                  } uninstallable APK.
#
# To ship a debug-signed APK instead (no keystore needed), run the workflow manually and choose "debug".

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "release = signed release APK (needs the keystore secrets), debug = debug-signed APK"
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'release' }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is not set. Add the Base64 of app/google-services.json (see the comments at the top of this workflow)."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Restore release keystore
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ]   && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]         && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]      && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Release builds must be signed, but these secrets are missing:$missing. Add them, or run the workflow manually with build_type = debug."
            exit 1
          fi
          # Keep the keystore outside the repository checkout.
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Work out the app version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="0.0.0-${GITHUB_SHA::7}"
          fi
          # versionCode must keep increasing so a new APK can update the previous one.
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Building $BUILD_TYPE APK, versionName=$VERSION_NAME versionCode=$GITHUB_RUN_NUMBER"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            TASK=assembleRelease
          else
            TASK=assembleDebug
          fi
          ./gradlew "$TASK" --stacktrace \
            -PappVersionName="$VERSION_NAME" \
            -PappVersionCode="$VERSION_CODE"

      - name: Verify the APK is signed and give it a clean name
        run: |
          APK=$(find "app/build/outputs/apk/$BUILD_TYPE" -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced in app/build/outputs/apk/$BUILD_TYPE"
            exit 1
          fi
          echo "Built: $APK"

          case "$APK" in
            *unsigned*)
              echo "::error::The build produced an UNSIGNED APK ($APK), which cannot be installed. Refusing to publish it."
              exit 1
              ;;
          esac

          # apksigner exits non-zero if the signature is missing or invalid.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          if [ "$BUILD_TYPE" = "release" ]; then
            NAME="HymnLink-${SAFE_REF}.apk"
          else
            NAME="HymnLink-${SAFE_REF}-debug.apk"
          fi
          mkdir -p dist
          cp "$APK" "dist/$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          ls -la dist

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APK_NAME }}
          generate_release_notes: true
          prerelease: ${{ env.BUILD_TYPE == 'debug' }}

      - name: Remove secrets from the runner
        if: always()
        run: rm -f app/google-services.json "$RUNNER_TEMP/release.jks"
